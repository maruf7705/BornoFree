[package]
name = "borno-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line tool and GUI toolbar for BornoFree"

[dependencies]
borno-core = { path = "../borno-core" }
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
rustyline = "14.0"

[[bin]]
name = "BornoFree"
path = "src/main.rs"

[build-dependencies]
winres = "0.1.12"
